<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>글러브 터치 — 1인칭 복싱</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --red:#e5352b; --red-d:#a3160f; --blue:#3f86ff; --blue-d:#1d4ec0; --gold:#ffd34d;
    --ink:rgba(8,10,16,.74); --line:rgba(255,255,255,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#fff;user-select:none;-webkit-user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  body.play:not(.menu) #c{cursor:none}

  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
  body.play #hud{opacity:1}
  .top{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:min(1000px,94vw);
    display:grid;grid-template-columns:1fr auto 1fr;gap:22px;align-items:start}
  .side .name{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:14px;letter-spacing:.14em;margin-bottom:6px;text-shadow:0 1px 6px #000}
  .side.r .name{flex-direction:row-reverse}
  .hits{font-weight:600;font-size:12px;letter-spacing:.04em;opacity:.85}
  .hits b{font-size:17px;color:var(--gold);margin-left:4px;font-variant-numeric:tabular-nums}
  .bar{height:16px;background:rgba(6,8,14,.7);border:1px solid var(--line);transform:skewX(-16deg);overflow:hidden}
  .bar i{display:block;height:100%;width:100%;background:linear-gradient(#ff6a5c,var(--red-d));transition:width .14s ease-out}
  .side.r .bar i{margin-left:auto;background:linear-gradient(#73acff,var(--blue-d))}
  .bar.st{height:7px;width:68%;margin-top:6px}
  .bar.st i{background:linear-gradient(#ffe48a,#e8a81c)}
  .clock{text-align:center;min-width:128px;text-shadow:0 2px 10px #000}
  #roundLbl{font-size:12px;font-weight:800;letter-spacing:.3em;opacity:.8}
  #timer{font-size:40px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;font-style:italic}

  #banner{position:absolute;left:0;right:0;top:30%;text-align:center;font-weight:900;font-style:italic;opacity:0;
    font-size:clamp(48px,11vw,150px);letter-spacing:.02em;text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 40px rgba(0,0,0,.6)}
  #banner.go{animation:pop var(--dur,1.1s) both}
  #banner.count{font-size:clamp(90px,20vw,260px);top:22%;color:#fff}
  #banner.ko{color:var(--gold);font-size:clamp(90px,19vw,250px)}
  #banner.down{color:var(--red)}
  #banner.fight{color:var(--gold)}
  @keyframes pop{0%{opacity:0;transform:scale(1.9)}14%{opacity:1;transform:scale(1)}75%{opacity:1;transform:scale(1.03)}100%{opacity:0;transform:scale(1.08)}}

  #floats{position:absolute;left:0;right:0;top:44%;height:0}
  .float{position:absolute;left:50%;transform:translateX(-50%);font-weight:900;font-style:italic;font-size:30px;white-space:nowrap;
    text-shadow:0 2px 0 #000,0 0 16px rgba(0,0,0,.8);animation:rise .9s ease-out both}
  @keyframes rise{0%{opacity:0;margin-top:14px}15%{opacity:1}100%{opacity:0;margin-top:-56px}}

  .pill{position:absolute;left:50%;transform:translateX(-50%);padding:10px 22px;border-radius:999px;background:var(--ink);
    border:1px solid var(--line);font-weight:700;font-size:17px;white-space:nowrap;opacity:0;transition:opacity .2s}
  .pill.show{opacity:1}
  #prompt{bottom:19%}
  #prompt.show{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{transform:translateX(-50%) scale(1.06)}}
  #hint{bottom:30%;font-size:20px;color:var(--gold);border-color:rgba(255,211,77,.5)}

  #meterWrap{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);width:min(460px,80vw);text-align:center;opacity:0;transition:opacity .2s}
  #meterWrap.show{opacity:1}
  #meterWrap .lbl{font-weight:900;font-size:22px;margin-bottom:10px;text-shadow:0 2px 8px #000}
  .mbar{height:22px;border-radius:999px;background:rgba(6,8,14,.75);border:1px solid var(--line);overflow:hidden}
  .mbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8a81c,#ffe48a)}

  .legend{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:12px;opacity:.5;letter-spacing:.03em;text-shadow:0 1px 4px #000}
  .legend b{font-weight:800;opacity:1}

  #vign{position:fixed;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at center,transparent 38%,rgba(210,0,0,.8) 100%)}
  #cross{position:fixed;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;pointer-events:none;display:none;
    border:2px solid rgba(255,255,255,.75);box-shadow:0 0 0 1px rgba(0,0,0,.5);transition:width .08s,height .08s,margin .08s,border-color .08s}
  #cross::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:#fff}
  body.play:not(.menu) #cross{display:block}
  #cross.head{border-color:var(--gold);width:38px;height:38px;margin:-19px 0 0 -19px}
  #cross.body{border-color:#fff}
  #cross.far{border-color:rgba(255,255,255,.35);border-style:dashed}

  #pause{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);
    font-size:34px;font-weight:900;font-style:italic;letter-spacing:.05em}
  #pause.show{display:flex}

  #overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;
    background:radial-gradient(ellipse at center,rgba(0,0,0,.25),rgba(0,0,0,.72))}
  #overlay.show{display:flex}
  #panel{width:min(640px,100%);max-height:100%;overflow:auto;background:var(--ink);border:1px solid var(--line);border-radius:18px;
    padding:30px 32px 28px;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 30px 80px rgba(0,0,0,.6)}
  #panel h1{margin:0;font-size:clamp(44px,9vw,76px);font-weight:900;font-style:italic;letter-spacing:-.01em;line-height:1}
  #panel h1 span{color:var(--red)}
  #panel h2{margin:0 0 6px;font-size:clamp(34px,7vw,56px);font-weight:900;font-style:italic;line-height:1.05}
  #panel h2.win{color:var(--gold)} #panel h2.lose{color:#ff7468}
  .sub{margin:8px 0 22px;opacity:.7;font-size:15px;letter-spacing:.2em}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;text-align:left;font-size:14.5px;margin:0 auto 16px}
  .keys div{display:flex;gap:10px;align-items:center}
  kbd{flex:none;min-width:72px;text-align:center;padding:4px 8px;border-radius:7px;background:rgba(255,255,255,.1);border:1px solid var(--line);
    font:700 12.5px/1.2 inherit;font-family:inherit}
  .tip{font-size:13.5px;line-height:1.6;opacity:.8;margin:0 0 20px;text-align:left;padding:12px 14px;border-left:3px solid var(--gold);background:rgba(255,211,77,.07);border-radius:0 8px 8px 0}
  .diff{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
  button{font:inherit;color:#fff;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.07);border-radius:10px;padding:9px 18px;font-weight:700;font-size:14.5px}
  button:hover{background:rgba(255,255,255,.14)}
  .diff button.on{background:#fff;color:#0b0d14;border-color:#fff}
  button.primary{display:block;width:100%;padding:15px;font-size:19px;font-weight:900;border:0;background:linear-gradient(#f04a3f,var(--red-d));letter-spacing:.04em}
  button.primary:hover{filter:brightness(1.12)}
  button.ghost{margin-top:10px;width:100%;background:transparent}
  button:disabled{opacity:.6;cursor:default;filter:none}
  #roster{position:absolute;left:max(3vw,calc(50% - 500px));top:104px;display:none;flex-direction:column;gap:6px;font-size:12.5px;font-weight:700;text-shadow:0 1px 4px #000}
  .rrow{display:flex;align-items:center;gap:7px}
  .rrow .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .rrow .rn{width:92px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rrow .rbar{width:84px;height:6px;background:rgba(6,8,14,.7);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .rrow .rbar i{display:block;height:100%;width:100%;transition:width .14s}
  .rrow.tg .rn{color:var(--gold)} .rrow.tg .rn::before{content:"▸ "}
  .rrow.dead{opacity:.38} .rrow.dead .rn{text-decoration:line-through}
  .plist{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:14px 0 16px;text-align:left;font-weight:700;font-size:15px}
  .plist div{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:9px;background:rgba(255,255,255,.06)}
  .plist i{width:11px;height:11px;border-radius:50%;flex:none}
  .join{display:flex;gap:8px;margin:12px 0 2px}
  .join input{flex:1;min-width:0;font:inherit;font-weight:700;font-size:15px;color:#fff;background:rgba(255,255,255,.07);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;outline:none;user-select:text;-webkit-user-select:text}
  .join input:focus{border-color:rgba(255,255,255,.5)}
  #code{text-transform:uppercase;letter-spacing:.18em}
  .code{font-size:clamp(44px,10vw,64px);font-weight:900;font-style:italic;letter-spacing:.16em;color:var(--gold);margin:2px 0 8px;
    user-select:text;-webkit-user-select:text}
  table.card{width:100%;border-collapse:collapse;margin:16px 0 20px;font-size:14px;font-variant-numeric:tabular-nums}
  .card th{font-weight:600;font-size:11.5px;opacity:.65;padding:6px 4px;border-bottom:1px solid var(--line)}
  .card td{padding:9px 4px;border-bottom:1px solid rgba(255,255,255,.07)}
  .card tfoot td{font-weight:900;font-size:17px;border-bottom:0;padding-top:12px}
  .card .me{color:#ff8a80}.card .op{color:#8db8ff}
  .note{font-size:12.5px;opacity:.6;margin:-8px 0 16px}
  #err{position:fixed;left:8px;bottom:8px;max-width:70vw;font:12px/1.4 ui-monospace,monospace;color:#ff8a80;white-space:pre-wrap;pointer-events:none}
  #dbg{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="top">
    <div class="side l">
      <div class="name"><span id="pname">나</span><span class="hits"><span id="phlbl">머리 유효타</span><b id="phits">0</b></span></div>
      <div class="bar"><i id="php"></i></div>
      <div class="bar st"><i id="pst"></i></div>
    </div>
    <div class="clock"><div id="roundLbl">ROUND 1</div><div id="timer">1:00</div></div>
    <div class="side r">
      <div class="name"><span id="oname">상대</span><span class="hits"><span id="ohlbl">머리 유효타</span><b id="ohits">0</b></span></div>
      <div class="bar"><i id="ohp"></i></div>
    </div>
  </div>
  <div id="roster"></div>
  <div id="banner"></div>
  <div id="floats"></div>
  <div id="hint" class="pill"></div>
  <div id="prompt" class="pill"></div>
  <div id="meterWrap"><div class="lbl">연타해서 일어나기! (클릭 / 아무 키)</div><div class="mbar"><i id="meter"></i></div></div>
  <div class="legend"><b>WASD</b> 이동 · <b>좌/우클릭</b> 잽·스트레이트 · <b>Q/E</b> 기울이기 (+클릭 훅) · <b>Q↔E</b> 위빙 · <b>Shift</b> 숙이기 (+클릭 어퍼컷) · <b>Space</b> 가드 · <b>Tab</b> 상대 바꾸기 (난투) · <b>P</b> 일시정지 · <b>M</b> 소리</div>
</div>

<div id="vign"></div>
<div id="cross"></div>
<div id="pause">일시정지 — P 를 눌러 계속</div>
<div id="overlay"><div id="panel"></div></div>
<div id="err"></div>
<div id="dbg"></div>

<script src="three.min.js"></script>
<script>window.THREE || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>');</script>
<script src="game.js"></script>
</body>
</html>
